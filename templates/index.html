<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>A股超短线选股扫描器</title>
<link rel="stylesheet" href="/static/style.css?v=1.18.5">
<script>
// 全局错误捕获：将 JS 错误显示在页面上，避免静默崩溃
window.addEventListener('error', function(e) {
    var errEl = document.getElementById('js-error');
    if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'js-error';
        errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f87171;color:#fff;padding:12px 20px;font-size:13px;font-family:monospace;text-align:center';
        document.body.prepend(errEl);
    }
    errEl.textContent = '⚠️ JS Error: ' + (e.message || e.error || 'unknown') + ' (at ' + (e.filename || '') + ':' + (e.lineno || '') + ')';
    console.error('[Global Error]', e);
});
window.addEventListener('unhandledrejection', function(e) {
    var errEl = document.getElementById('js-error');
    if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'js-error';
        errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f87171;color:#fff;padding:12px 20px;font-size:13px;font-family:monospace;text-align:center';
        document.body.prepend(errEl);
    }
    errEl.textContent = '⚠️ Promise Error: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
    console.error('[Unhandled Rejection]', e.reason);
});
</script>
</head>
<body>

<!-- ═══ 侧边导航 ═══ -->
<nav class="sidebar">
    <div class="logo">
        📈 选股扫描器
        <small>超短线 · 首板策略</small>
    </div>
    <div class="nav-item" data-page="scan-trend">
        <span class="icon">📊</span> 趋势扫描
    </div>
    <div class="nav-item" data-page="scan-limit">
        <span class="icon">🛡️</span> 涨停扫描
    </div>
    <div class="nav-item" data-page="scan-sector">
        <span class="icon">🧩</span> 板块热度
    </div>
    <div class="nav-item" data-page="scan-zhaban">
        <span class="icon">💥</span> 炸板分析
    </div>
    <div class="nav-item" data-page="scan-reversal">
        <span class="icon">🔄</span> 反转扫描
    </div>
    <div class="nav-item" data-page="scan-dtqiaoban">
        <span class="icon">📉</span> 跌停翘板
    </div>
    <div class="nav-item" data-page="indicators">
        <span class="icon">🏆</span> 龙虎榜分析
    </div>
    <div class="nav-item" data-page="community">
        <span class="icon">💬</span> 舆情监测
    </div>
    <div class="nav-item" data-page="sentiment">
        <span class="icon">🌡️</span> 市场情绪
    </div>
    <div class="nav-item" data-page="backtest">
        <span class="icon">⏱️</span> 回测系统
    </div>
    <div style="flex:1"></div>
    <div class="nav-item" id="version-btn" onclick="showChangelog()" title="查看更新日志">
        <span class="icon">📦</span> <span id="version-label">版本</span>
    </div>
</nav>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ═══ 主内容区 ═══ -->
<main class="main">
    <div class="mobile-header">
        <button class="hamburger" onclick="toggleSidebar()" aria-label="菜单">☰</button>
        <span class="mobile-title">选股扫描器</span>
    </div>
    <!-- ═══ 市场概览 Dashboard ═══ -->
    <div class="dashboard-bar" id="dashboard">
        <div class="dash-loading">📊 加载今日市场数据...</div>
    </div>

    <!-- ═══ 当前模块 ═══ -->
    <!-- ═══ 全局工具栏（所有板块共享） ═══ -->
    <div class="global-toolbar" style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card-bg,#1e2233);border-radius:8px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn btn-orange" onclick="fetchAllRawData()" title="从 akshare 拉取全部原始数据（涨停+炸板+跌停+资金流+情绪）并缓存 — 耗时 15-20 秒" style="font-size:14px;padding:8px 16px">📡 拉取数据</button>
        <button class="btn" onclick="runCurrentFromCache()" title="从缓存重跑当前板块评分（秒出，改代码后用）" style="font-size:14px;padding:8px 16px">▶ 运行</button>
        <span class="principal-group">
            本金 <input type="number" id="principal-input" value="20000" min="1000" step="1000" class="principal-input" title="输入本金金额（元）">
        </span>
        <span class="principal-group">
            方案 <select id="plan-select" class="principal-input" style="width:auto;text-align:left" title="切换评分方案" onchange="savePlan()">
                <option value="">Plan A</option>
            </select>
        </span>
        <span style="font-size:11px;color:var(--text-muted);margin-left:auto" id="cache-status">加载中...</span>
    </div>

    <div class="module-page">
        <div class="main-header">
            <h1 id="page-title">🛡️ 涨停扫描</h1>
        </div>

    <!-- 输出区 -->
    <div class="card">
        <div class="card-header-bar" id="param-bar" style="display:none"></div>

    <!-- 快捷操作（自选页面隐藏） -->
    <div class="quick-actions" id="quick-actions">
        <button class="btn btn-sm" onclick="exportOutput()">📋 复制输出</button>
        <button class="btn btn-orange btn-sm" onclick="clearOutput()">🗑️ 清空</button>
    </div>
        <!-- 进度条 -->
        <div class="progress-container" id="progress-bar" style="display:none">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-status" id="progress-text">就绪</div>
        </div>
        <div class="output-area" id="output">
            <span class="loading">输出结果</span>
        </div>
    </div> <!-- /card -->
    </div> <!-- /module-page -->
</main>

<script src="/static/cards.js?v=1.21.0"></script>
<script src="/static/dashboard.js?v=1.21.0"></script>
<script src="/static/app.js?v=1.21.0"></script>
</body>
</html>

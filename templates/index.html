<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股超短线选股扫描器</title>
<link rel="stylesheet" href="/static/style.css">
<script>
// 全局错误捕获：将 JS 错误显示在页面上，避免静默崩溃
window.addEventListener('error', function(e) {
    var errEl = document.getElementById('js-error');
    if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'js-error';
        errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f87171;color:#fff;padding:12px 20px;font-size:13px;font-family:monospace;text-align:center';
        document.body.prepend(errEl);
    }
    errEl.textContent = '⚠️ JS Error: ' + (e.message || e.error || 'unknown') + ' (at ' + (e.filename || '') + ':' + (e.lineno || '') + ')';
    console.error('[Global Error]', e);
});
window.addEventListener('unhandledrejection', function(e) {
    var errEl = document.getElementById('js-error');
    if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'js-error';
        errEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f87171;color:#fff;padding:12px 20px;font-size:13px;font-family:monospace;text-align:center';
        document.body.prepend(errEl);
    }
    errEl.textContent = '⚠️ Promise Error: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
    console.error('[Unhandled Rejection]', e.reason);
});
</script>
</head>
<body>

<!-- ═══ 侧边导航 ═══ -->
<nav class="sidebar">
    <div class="logo">
        📈 选股扫描器
        <small>超短线 · 首板策略</small>
    </div>
    <div class="nav-item" data-page="scan-limit">
        <span class="icon">🛡️</span> 涨停扫描
    </div>
    <div class="nav-item" data-page="scan-trend">
        <span class="icon">📊</span> 趋势扫描
    </div>
    <div class="nav-item" data-page="scan-sector">
        <span class="icon">🧩</span> 板块热度
    </div>
    <div class="nav-item" data-page="scan-zhaban">
        <span class="icon">💥</span> 炸板分析
    </div>
    <div class="nav-item" data-page="scan-dtqiaoban">
        <span class="icon">📉</span> 跌停翘板
    </div>
    <div class="nav-item" data-page="indicators">
        <span class="icon">🏆</span> 龙虎榜分析
    </div>
    <div class="nav-item" data-page="community">
        <span class="icon">💬</span> 舆情监测
    </div>
    <div class="nav-item" data-page="sentiment">
        <span class="icon">🌡️</span> 市场情绪
    </div>
    <div class="nav-item" data-page="backtest">
        <span class="icon">⏱️</span> 回测系统
    </div>
    <div style="flex:1"></div>
    <div class="nav-item" id="version-btn" onclick="showChangelog()" title="查看更新日志">
        <span class="icon">📦</span> <span id="version-label">版本</span>
    </div>
    <div style="padding:8px 20px 4px;font-size:11px;color:var(--text-muted);letter-spacing:0.5px">🎨 背景主题</div>
    <div class="bg-presets">
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0c1220,#1a2744)" onclick="setBgPreset('linear-gradient(135deg,#0c1220 0%,#1a2744 50%,#0d1b2a 100%)')" title="深海蓝"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0f0c29,#302b63)" onclick="setBgPreset('linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)')" title="极光紫"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0b1d1a,#1a3a32)" onclick="setBgPreset('linear-gradient(135deg,#0b1d1a 0%,#1a3a32 50%,#0d2018 100%)')" title="墨玉绿"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#1a0c0c,#3a1a1a)" onclick="setBgPreset('linear-gradient(135deg,#1a0c0c 0%,#3a1a1a 50%,#2a0d0d 100%)')" title="暗夜红"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#1a140c,#3a2a1a)" onclick="setBgPreset('linear-gradient(135deg,#1a140c 0%,#3a2a1a 50%,#2a1a0d 100%)')" title="暖阳橙"></div>

        <div class="bg-swatch bg-swatch-upload" onclick="document.getElementById('bg-input').click()" title="自定义图片">📁</div>
    </div>
    <div class="nav-item" onclick="clearBackground()" title="恢复默认背景">
        <span class="icon">🗑️</span> 清除背景
    </div>
    <input type="file" id="bg-input" accept="image/*" style="display:none" onchange="setBackground(this)">
</nav>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ═══ 主内容区 ═══ -->
<main class="main">
    <div class="mobile-header">
        <button class="hamburger" onclick="toggleSidebar()" aria-label="菜单">☰</button>
        <span class="mobile-title">选股扫描器</span>
    </div>
    <!-- ═══ 市场概览 Dashboard ═══ -->
    <div class="dashboard-bar" id="dashboard">
        <div class="dash-loading">📊 加载今日市场数据...</div>
    </div>

    <!-- ═══ 当前模块 ═══ -->
    <div class="module-page">
        <div class="main-header">
            <h1 id="page-title">🛡️ 涨停扫描</h1>
        </div>

    <!-- 输出区（与操作按钮在同一卡片） -->
    <div class="card">
        <div class="card-header-bar" id="param-bar">
            <button class="btn" onclick="runCurrent()">▶ 运行</button>
            <button class="btn btn-orange btn-sm" onclick="refreshCurrent()" title="强制重新拉取数据并更新缓存">🔄 刷新</button>
        </div>

    <!-- 快捷操作（自选页面隐藏） -->
    <div class="quick-actions" id="quick-actions">
        <button class="btn btn-sm" onclick="exportOutput()">📋 复制输出</button>
        <button class="btn btn-orange btn-sm" onclick="clearOutput()">🗑️ 清空</button>
    </div>
        <!-- 进度条 -->
        <div class="progress-container" id="progress-bar" style="display:none">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-status" id="progress-text">就绪</div>
        </div>
        <div class="output-area" id="output">
            <span class="loading">输出结果</span>
        </div>
    </div> <!-- /card -->
    </div> <!-- /module-page -->
</main>

<script src="/static/cards.js?v=20260529"></script>
<script src="/static/dashboard.js?v=20260529"></script>
<script src="/static/app.js?v=20260529"></script>
</body>
</html>

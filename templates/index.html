<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股超短线选股扫描器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══ 侧边导航 ═══ -->
<nav class="sidebar">
    <div class="logo">
        📈 选股扫描器
        <small>超短线 · 首板策略</small>
    </div>
    <div class="nav-item active" data-page="scan-limit">
        <span class="icon">🛡️</span> 涨停扫描
    </div>
    <div class="nav-item" data-page="scan-trend">
        <span class="icon">📊</span> 趋势扫描
    </div>
    <div class="nav-item" data-page="scan-sector">
        <span class="icon">🧩</span> 板块热度
    </div>
    <div class="nav-item" data-page="scan-zhaban">
        <span class="icon">💥</span> 炸板分析
    </div>
    <div class="nav-item" data-page="scan-dtqiaoban">
        <span class="icon">📉</span> 跌停翘板
    </div>
    <div class="nav-item" data-page="indicators">
        <span class="icon">🏆</span> 龙虎榜分析
    </div>
    <div class="nav-item" data-page="community">
        <span class="icon">💬</span> 舆情监测
    </div>
    <div class="nav-item" data-page="sentiment">
        <span class="icon">🌡️</span> 市场情绪
    </div>
    <div class="nav-item" data-page="backtest">
        <span class="icon">⏱️</span> 回测系统
    </div>
</nav>

<!-- ═══ 主内容区 ═══ -->
<main class="main">
    <div class="main-header">
        <h1 id="page-title">🛡️ 涨停扫描</h1>
        <span class="date" id="today-display"></span>
    </div>

    <!-- 参数栏 -->
    <div class="params" id="param-bar">
        <label>输出格式：</label>
        <select id="output-mode">
            <option value="card">📇 卡片视图</option>
            <option value="table">表格模式</option>
            <option value="detail">详细文本</option>
        </select>
        <button class="btn" onclick="runCurrent()">▶ 运行</button>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions" id="quick-actions">
        <button class="btn btn-green btn-sm" onclick="runAll()">⚡ 一键全扫描</button>
        <button class="btn btn-sm" onclick="exportOutput()">📋 复制输出</button>
        <button class="btn btn-orange btn-sm" onclick="clearOutput()">🗑️ 清空</button>
    </div>

    <!-- 输出区 -->
    <div class="card">
        <h2>输出结果</h2>
        <div class="output-area" id="output">
            <span class="loading">就绪 — 点击「运行」开始扫描</span>
        </div>
    </div>
</main>

<script>
// ═══════════════════════════════════════════
//  页面状态
// ═══════════════════════════════════════════

const PAGES = {
    'scan-limit':   { title: '🛡️ 涨停扫描',     api: '/api/scan/limit-up',    cardApi: '/api/scan/limit-up/cards',    showMode: true },
    'scan-trend':   { title: '📊 趋势扫描',     api: '/api/scan/trend',       cardApi: '/api/scan/trend/cards',      showMode: true },
    'scan-sector':  { title: '🧩 板块热度',     api: '/api/scan/sector',      cardApi: '/api/scan/sector/cards',     showMode: true },
    'scan-zhaban':  { title: '💥 炸板分析',     api: '/api/scan/zhaban',      cardApi: '/api/scan/zhaban/cards',     showMode: true },
    'scan-dtqiaoban':{title: '📉 跌停翘板',     api: '/api/scan/dtqiaoban',   cardApi: '/api/scan/dtqiaoban/cards',  showMode: true },
    'indicators':   { title: '🏆 龙虎榜分析',   api: '/api/indicators',       cardApi: null, showMode: false },
    'community':    { title: '💬 舆情监测',     api: '/api/community',        cardApi: null, showMode: false },
    'sentiment':    { title: '🌡️ 市场情绪',     api: '/api/sentiment',        cardApi: null, showMode: false },
    'backtest':     { title: '⏱️ 回测系统',     api: '/api/backtest',         cardApi: null, showMode: false },
};

let currentPage = 'scan-limit';

// ═══════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('today-display').textContent =
        '📅 ' + new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    // 导航点击
    document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
            const page = el.dataset.page;
            switchPage(page);
        });
    });

    // Enter 键触发运行
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
            runCurrent();
        }
    });
});

// ═══════════════════════════════════════════
//  页面切换
// ═══════════════════════════════════════════

function switchPage(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });

    const info = PAGES[page];
    document.getElementById('page-title').textContent = info.title;

    // 显示/隐藏模式选择
    document.getElementById('output-mode').style.display = info.showMode ? 'inline' : 'none';
    document.getElementById('output-mode').previousElementSibling.style.display = info.showMode ? 'inline' : 'none';
}

// ═══════════════════════════════════════════
//  运行扫描
// ═══════════════════════════════════════════

async function runCurrent() {
    const info = PAGES[currentPage];
    if (!info) return;
    await callApi(info.api, currentPage);
}

async function callApi(apiUrl, pageKey) {
    const output = document.getElementById('output');
    output.innerHTML = '<span class="loading">⏳ 正在扫描，请稍候...</span>';

    const mode = document.getElementById('output-mode').value;
    const info = PAGES[pageKey] || PAGES['scan-limit'];

    // 卡片模式 — 有 cardApi 的页面使用
    if (mode === 'card' && info.cardApi) {
        await loadCardView(output, pageKey);
        return;
    }

    // 普通模式
    const params = new URLSearchParams();
    if (info.showMode) {
        params.set('table', mode === 'table' ? 'true' : 'false');
    }
    const url = apiUrl + (params.toString() ? '?' + params.toString() : '');

    try {
        const resp = await fetch(url);
        const data = await resp.json();

        if (data.ok === false) {
            output.innerHTML = `<span class="error-text">❌ 错误：</span>\n${escapeHtml(data.error || '未知错误')}\n\n${escapeHtml(data.output || '')}`;
        } else {
            const txt = data.output || '(空)';
            const html = renderTableOutput(txt);
            if (html) {
                output.innerHTML = html;
            } else {
                output.textContent = txt;
            }
        }
    } catch (err) {
        output.innerHTML = `<span class="error-text">❌ 请求失败：</span> ${escapeHtml(err.message)}`;
    }
}

function analyzeStock(stk) {
    const tags = [];
    const notes = [];

    // 封板时间分析
    const st = parseInt(stk.seal_time);
    if (st <= 0930) tags.push({text:'开盘秒板', cls:'tag-green'});
    else if (st <= 1000) tags.push({text:'早盘板', cls:'tag-blue'});
    else if (st <= 1100) tags.push({text:'上午板', cls:'tag-blue'});
    else if (st <= 1400) tags.push({text:'午后板', cls:'tag-yellow'});
    else tags.push({text:'尾盘偷袭', cls:'tag-red'});

    // 资金分析
    if (stk.net_money > 1e8) {
        tags.push({text:'主力强', cls:'tag-green'});
    } else if (stk.net_money > 5e7) {
        tags.push({text:'资金正', cls:'tag-blue'});
    } else if (stk.net_money < 0) {
        tags.push({text:'资金流出', cls:'tag-red'});
        notes.push('⚠️ 主力净流出，注意次日抛压');
    }

    // 换手率分析
    const tr = parseFloat(stk.turnover);
    if (tr > 25) {
        tags.push({text:'爆量', cls:'tag-yellow'});
        notes.push('⚠️ 换手过高(>' + tr + '%)，次日接力难度大');
    } else if (tr > 15) {
        tags.push({text:'高换手', cls:'tag-yellow'});
    } else if (tr < 5) {
        tags.push({text:'缩量', cls:'tag-green'});
        notes.push('✅ 缩量涨停(' + tr + '%)，筹码锁定良好');
    }

    // 评分分析
    if (stk.sector_score >= 10) tags.push({text:'板块龙', cls:'tag-green'});
    if (stk.money_score >= 12) tags.push({text:'资金龙', cls:'tag-green'});
    if (stk.seal_score >= 22) tags.push({text:'封板强', cls:'tag-green'});

    // 综合评语
    if (stk.total_score >= 80) notes.push('🔥 综合评分优秀，多因子共振');
    else if (stk.total_score >= 70) notes.push('✅ 评分良好，关注次日竞价');
    else notes.push('📌 评分一般，需结合板块和资金面判断');

    return { tags, notes };
}

async function loadCardView(output, pageKey) {
    const info = PAGES[pageKey] || PAGES['scan-limit'];
    try {
        const resp = await fetch(info.cardApi);
        const data = await resp.json();

        const items = data.stocks || data.items || [];
        if (!data.ok || !items.length) {
            output.innerHTML = '<span class="loading">暂无数据</span>';
            return;
        }

        const s = data.sentiment || {};
        let html = '';
        if (s.level) {
            html += '<div class="sentiment-banner">';
            html += `📊 市场情绪: <strong>${s.level || '未知'}</strong>`;
            if (s.multiplier) html += ` ｜ 评分乘数 ×${s.multiplier}`;
            html += '</div>';
        }

        // 按页面类型渲染
        if (pageKey === 'scan-sector') {
            html += renderSectorCards(items);
        } else if (pageKey === 'scan-limit') {
            html += renderStockCards(items, data);
        } else {
            html += renderSimpleCards(items, pageKey);
        }
    } catch (err) {
        output.innerHTML = `<span class="error-text">❌ 请求失败：</span> ${escapeHtml(err.message)}`;
    }
}

// ═══════════════════════════════════════════
//  各页面卡片渲染
// ═══════════════════════════════════════════

function renderStockCards(stocks, data) {
    let html = '<div class="card-list">';
    for (const stk of stocks) {
        const analysis = analyzeStock(stk);
        const scoreColor = stk.total_score >= 80 ? '#34d399' :
                           stk.total_score >= 70 ? '#fbbf24' : '#f87171';
        const moneyColor = stk.net_money >= 0 ? '#34d399' : '#f87171';
        const moneySign = stk.net_money >= 0 ? '+' : '';
        const st = stk.seal_time || '0000';

        html += `<a href="${escapeHtml(stk.url)}" target="_blank" class="stock-card">`;
        html += `<div class="card-header">`;
        html += `<span class="card-rank">#${stk.rank}</span>`;
        html += `<span class="card-name">${escapeHtml(stk.name)}</span>`;
        html += `<span class="card-code">${escapeHtml(stk.code)}</span>`;
        html += `<span class="card-score" style="color:${scoreColor}">${stk.total_score}</span>`;
        html += `</div>`;
        html += '<div class="card-body">';
        html += '<div class="card-bars">';
        const bars = [
            {label:'涨停强度', score:stk.seal_score, max:32},
            {label:'资金面', score:stk.money_score, max:20},
            {label:'板块热度', score:stk.sector_score, max:22},
            {label:'量价关系', score:stk.tech_score, max:10},
            {label:'历史股性', score:stk.history_score, max:5},
            {label:'舆情评分', score:stk.community_score, max:7},
        ];
        for (const b of bars) {
            const pct = Math.min(100, (b.score / b.max) * 100);
            html += `<div class="bar-row"><span class="bar-label">${b.label}</span>`;
            html += `<div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
            html += `<span class="bar-val">${b.score}</span></div>`;
        }
        html += '</div>';
        const netPct = stk.base_score > 0 ? ((stk.total_score - stk.base_score) / stk.base_score * 100).toFixed(1) : '0';
        html += '<div class="card-info">';
        html += `<div class="info-row"><span class="label">基础分</span><span class="value">${stk.base_score}</span></div>`;
        html += `<div class="info-row"><span class="label">情绪加成</span><span class="value">+${netPct}%</span></div>`;
        html += `<div class="info-row"><span class="label">净流入</span><span class="value ${stk.net_money >= 0 ? 'green' : 'red'}">${moneySign}${escapeHtml(stk.net_money_str)}</span></div>`;
        html += `<div class="info-row"><span class="label">换手率</span><span class="value">${escapeHtml(stk.turnover)}%</span></div>`;
        html += `<div class="info-row"><span class="label">封板时间</span><span class="value">${st.slice(0,2)}:${st.slice(2)}</span></div>`;
        html += '</div></div>';
        html += '<div class="card-analysis">';
        for (const tag of analysis.tags) {
            html += `<span class="tag ${tag.cls}">${escapeHtml(tag.text)}</span>`;
        }
        html += '</div>';
        if (analysis.notes.length) {
            html += '<div class="card-analysis" style="border-top:none;padding-top:0;margin-top:4px">';
            for (const note of analysis.notes) {
                html += `<span style="font-size:12px;color:var(--text-muted)">${escapeHtml(note)}</span>`;
            }
            html += '</div>';
        }
        html += '<div class="card-hint"><span>点击查看同花顺详情 →</span></div>';
        html += '</a>';
    }
    html += '</div>';
    return html;
}

function renderSectorCards(items) {
    let html = '<div class="card-list">';
    for (const item of items) {
        const effColor = item.efficiency >= 70 ? '#34d399' : item.efficiency >= 50 ? '#fbbf24' : '#f87171';
        html += `<div class="stock-card" style="cursor:default">`;
        html += `<div class="card-header">`;
        html += `<span class="card-rank">#${item.limit_count}只涨停</span>`;
        html += `<span class="card-name">${escapeHtml(item.name)}</span>`;
        html += `<span class="card-score" style="color:${effColor}">${item.score}</span>`;
        html += `</div>`;
        html += '<div class="card-body"><div class="card-bars">';
        const bars = [
            {label:'涨停数', score:item.limit_count, max:Math.max(1, item.limit_count*2)},
            {label:'炸板数', score:item.zhaban_count, max:Math.max(1, item.limit_count+item.zhaban_count)},
        ];
        for (const b of bars) {
            const pct = Math.min(100, (b.score / b.max) * 100);
            html += `<div class="bar-row"><span class="bar-label">${b.label}</span>`;
            html += `<div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
            html += `<span class="bar-val">${b.score}</span></div>`;
        }
        html += '</div>';
        html += '<div class="card-info">';
        html += `<div class="info-row"><span class="label">涨停</span><span class="value green">${item.limit_count}</span></div>`;
        html += `<div class="info-row"><span class="label">炸板</span><span class="value yellow">${item.zhaban_count}</span></div>`;
        html += `<div class="info-row"><span class="label">跌停</span><span class="value red">${item.dieting_count}</span></div>`;
        html += `<div class="info-row"><span class="label">封板率</span><span class="value" style="color:${effColor}">${item.efficiency}%</span></div>`;
        html += '</div></div>';
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function renderSimpleCards(items, pageKey) {
    const titles = {
        'scan-trend': '趋势动量',
        'scan-zhaban': '炸板分析',
        'scan-dtqiaoban': '跌停翘板',
    };
    const hasChange = pageKey === 'scan-trend';

    let html = '<div class="card-list">';
    for (let i = 0; i < items.length; i++) {
        const item = items[i];
        html += `<a href="${escapeHtml(item.url)}" target="_blank" class="stock-card">`;
        html += `<div class="card-header">`;
        html += `<span class="card-rank">#${i+1}</span>`;
        html += `<span class="card-name">${escapeHtml(item.name)}</span>`;
        html += `<span class="card-code">${escapeHtml(item.code)}</span>`;
        if (item.change_pct !== undefined) {
            const chgColor = item.change_pct >= 5 ? '#34d399' : item.change_pct >= 3 ? '#fbbf24' : '#f87171';
            html += `<span class="card-score" style="color:${chgColor}">+${item.change_pct}%</span>`;
        }
        html += `</div>`;
        if (item.seal_time) {
            const st = item.seal_time;
            html += `<div style="font-size:12px;color:var(--text-muted);padding:8px 0">封板时间: ${st.slice(0,2)}:${st.slice(2)}</div>`;
        }
        html += '<div class="card-hint"><span>点击查看同花顺详情 →</span></div>';
        html += '</a>';
    }
    html += '</div>';
    return html;
}

// ═══════════════════════════════════════════
//  一键全扫描
// ═══════════════════════════════════════════

async function runAll() {
    const output = document.getElementById('output');
    output.innerHTML = '<span class="loading">⏳ 正在全扫描，按顺序执行中...</span>';

    const scans = [
        { title: '=== 涨停扫描 ===', url: '/api/scan/limit-up?table=true' },
        { title: '=== 趋势扫描 ===', url: '/api/scan/trend?table=true' },
        { title: '=== 板块热度 ===', url: '/api/scan/sector?table=true' },
        { title: '=== 炸板分析 ===', url: '/api/scan/zhaban?table=true' },
        { title: '=== 跌停翘板 ===', url: '/api/scan/dtqiaoban?table=true' },
        { title: '=== 龙虎榜分析 ===', url: '/api/indicators' },
        { title: '=== 舆情监测 ===', url: '/api/community' },
        { title: '=== 市场情绪 ===', url: '/api/sentiment' },
    ];

    const parts = [];
    for (const scan of scans) {
        parts.push(`\n${scan.title}\n` + '-'.repeat(40));
        output.textContent = parts.join('\n') + '\n⏳ 正在请求 ' + scan.title + '...';

        try {
            const resp = await fetch(scan.url);
            const data = await resp.json();
            parts.push(data.output || '(空)');
        } catch (err) {
            parts.push(`❌ ${err.message}`);
        }
    }

    // 整体渲染：文本段落 + 表格混合
    let fullHtml = '';
    for (const part of parts) {
        const tbl = renderTableOutput(part);
        if (tbl) {
            fullHtml += tbl;
        } else {
            fullHtml += '<div class="output-text">' + escapeHtml(part) + '</div>';
        }
    }
    output.innerHTML = fullHtml || escapeHtml(parts.join('\n'));
}

// ═══════════════════════════════════════════
//  工具函数
// ═══════════════════════════════════════════

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ═══════════════════════════════════════════
//  表格渲染：将 ASCII 表格转为 HTML 表格
// ═══════════════════════════════════════════

function renderTableOutput(txt) {
    // 检测是否是表格格式（含 │ 分隔符和 ── 边框）
    const lines = txt.split('\n').filter(l => l.trim());
    if (lines.length < 3) return null;
    if (!lines[0].includes('─')) return null;

    // 找表头行（含 │ 且不含连续 ─）
    let headerIdx = -1, dataStart = -1;
    for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (l.includes('│') && !l.includes('┼') && headerIdx === -1) {
            headerIdx = i;
        }
        if (l.includes('┼')) {
            dataStart = i + 1;
        }
    }
    if (headerIdx === -1 || dataStart === -1) return null;

    // 解析表头
    const headers = lines[headerIdx].split('│').map(h => h.trim()).filter(h => h);

    // 解析数据行
    const rows = [];
    for (let i = dataStart; i < lines.length; i++) {
        const l = lines[i];
        if (l.includes('─')) break;  // 到底部边框
        if (!l.includes('│')) continue;
        const cells = l.split('│').map(c => c.trim()).filter(c => c);
        if (cells.length === headers.length) {
            rows.push(cells);
        }
    }
    if (!rows.length) return null;

    // 判断哪些列是数值列（检查第一行数据，排除序号和股票代码）
    const numCols = new Set();
    const centerCols = new Set();
    if (rows.length > 0) {
        for (let i = 0; i < headers.length; i++) {
            const val = (rows[0][i] || '').trim();
            const h = headers[i].trim();
            // 序号列居中
            if (h === '#' || h === '序号') {
                centerCols.add(i);
                continue;
            }
            // 股票代码列居中
            if (h.includes('代码')) {
                centerCols.add(i);
                continue;
            }
            // 数值列右对齐（纯数字、百分比、带亿/万单位）
            if (/^[+-]?(0|[1-9]\d*)(\.\d+)?(%|亿|万)?$/.test(val) && val.length < 12) {
                numCols.add(i);
            }
        }
    }

    // 构建 HTML 表格
    let html = '<div class="table-wrap"><table class="data-table">';
    html += '<thead><tr>';
    for (let i = 0; i < headers.length; i++) {
        const h = headers[i];
        let cls = '';
        if (numCols.has(i)) cls = 'num';
        else if (centerCols.has(i)) cls = 'center';
        html += cls ? `<th class="${cls}">${escapeHtml(h)}</th>` : `<th>${escapeHtml(h)}</th>`;
    }
    html += '</tr></thead><tbody>';
    for (const row of rows) {
        html += '<tr>';
        for (let i = 0; i < row.length; i++) {
            const val = row[i];
            let cls = '';
            if (numCols.has(i)) cls = 'num';
            else if (centerCols.has(i)) cls = 'center';
            html += cls ? `<td class="${cls}">${escapeHtml(val)}</td>` : `<td>${escapeHtml(val)}</td>`;
        }
        html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
}

function clearOutput() {
    document.getElementById('output').innerHTML = '<span class="loading">已清空</span>';
}

function exportOutput() {
    const txt = document.getElementById('output').textContent;
    navigator.clipboard.writeText(txt).then(() => {
        const btn = document.querySelector('.quick-actions .btn:nth-child(2)');
        const orig = btn.textContent;
        btn.textContent = '✅ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
    }).catch(() => {
        alert('复制失败，请手动选择文本复制');
    });
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股超短线选股扫描器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══ 侧边导航 ═══ -->
<nav class="sidebar">
    <div class="logo">
        📈 选股扫描器
        <small>超短线 · 首板策略</small>
    </div>
    <div class="nav-item active" data-page="scan-limit">
        <span class="icon">🛡️</span> 涨停扫描
    </div>
    <div class="nav-item" data-page="scan-trend">
        <span class="icon">📊</span> 趋势扫描
    </div>
    <div class="nav-item" data-page="scan-sector">
        <span class="icon">🧩</span> 板块热度
    </div>
    <div class="nav-item" data-page="scan-zhaban">
        <span class="icon">💥</span> 炸板分析
    </div>
    <div class="nav-item" data-page="scan-dtqiaoban">
        <span class="icon">📉</span> 跌停翘板
    </div>
    <div class="nav-item" data-page="indicators">
        <span class="icon">🏆</span> 龙虎榜分析
    </div>
    <div class="nav-item" data-page="community">
        <span class="icon">💬</span> 舆情监测
    </div>
    <div class="nav-item" data-page="sentiment">
        <span class="icon">🌡️</span> 市场情绪
    </div>
    <div class="nav-item" data-page="backtest">
        <span class="icon">⏱️</span> 回测系统
    </div>
    <div style="flex:1"></div>
    <div style="padding:8px 20px 4px;font-size:11px;color:var(--text-muted);letter-spacing:0.5px">🎨 背景主题</div>
    <div class="bg-presets">
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0c1220,#1a2744)" onclick="setBgPreset('linear-gradient(135deg,#0c1220 0%,#1a2744 50%,#0d1b2a 100%)')" title="深海蓝"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0f0c29,#302b63)" onclick="setBgPreset('linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)')" title="极光紫"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0b1d1a,#1a3a32)" onclick="setBgPreset('linear-gradient(135deg,#0b1d1a 0%,#1a3a32 50%,#0d2018 100%)')" title="墨玉绿"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#1a0c0c,#3a1a1a)" onclick="setBgPreset('linear-gradient(135deg,#1a0c0c 0%,#3a1a1a 50%,#2a0d0d 100%)')" title="暗夜红"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#1a140c,#3a2a1a)" onclick="setBgPreset('linear-gradient(135deg,#1a140c 0%,#3a2a1a 50%,#2a1a0d 100%)')" title="暖阳橙"></div>
        <div class="bg-swatch" style="background:linear-gradient(135deg,#0f1115,#1e2230)" onclick="setBgPreset('linear-gradient(135deg,#0f1115 0%,#1e2230 50%,#12141a 100%)')" title="星空灰"></div>
        <div class="bg-swatch bg-swatch-upload" onclick="document.getElementById('bg-input').click()" title="自定义图片">📁</div>
    </div>
    <div class="nav-item" onclick="clearBackground()" title="恢复默认背景">
        <span class="icon">🗑️</span> 清除背景
    </div>
    <input type="file" id="bg-input" accept="image/*" style="display:none" onchange="setBackground(this)">
</nav>

<!-- ═══ 主内容区 ═══ -->
<main class="main">
    <!-- ═══ 市场概览 Dashboard ═══ -->
    <div class="dashboard-bar" id="dashboard">
        <div class="dash-loading">📊 加载今日市场数据...</div>
    </div>

    <!-- ═══ 当前模块 ═══ -->
    <div class="module-page">
        <div class="main-header">
            <h1 id="page-title">🛡️ 涨停扫描</h1>
        </div>

    <!-- 输出区（与操作按钮在同一卡片） -->
    <div class="card">
        <div class="card-header-bar">
            <button class="btn" onclick="runCurrent()">▶ 运行</button>
        </div>

    <!-- 快捷操作 -->
    <div class="quick-actions" id="quick-actions">
        <button class="btn btn-sm" onclick="exportOutput()">📋 复制输出</button>
        <button class="btn btn-orange btn-sm" onclick="clearOutput()">🗑️ 清空</button>
    </div>
        <!-- 进度条 -->
        <div class="progress-container" id="progress-bar" style="display:none">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-status" id="progress-text">就绪</div>
        </div>
        <div class="output-area" id="output">
            <span class="loading">就绪 — 点击「运行」开始扫描</span>
        </div>
    </div> <!-- /card -->
    </div> <!-- /module-page -->
</main>

<script>
// ═══════════════════════════════════════════
//  页面状态
// ═══════════════════════════════════════════

const PAGES = {
    'scan-limit':   { title: '🛡️ 涨停扫描',   api: '/api/scan/limit-up/cards', textApi: '/api/scan/limit-up' },
    'scan-trend':   { title: '📊 趋势扫描',   api: '/api/scan/trend/cards',   textApi: '/api/scan/trend' },
    'scan-sector':  { title: '🧩 板块热度',   api: '/api/scan/sector/cards',  textApi: '/api/scan/sector' },
    'scan-zhaban':  { title: '💥 炸板分析',   api: '/api/scan/zhaban/cards',  textApi: '/api/scan/zhaban' },
    'scan-dtqiaoban':{title:'📉 跌停翘板',   api: '/api/scan/dtqiaoban/cards',textApi: '/api/scan/dtqiaoban' },
    'indicators':   { title: '🏆 龙虎榜分析', api: '/api/indicators' },
    'community':    { title: '💬 舆情监测',   api: '/api/community' },
    'sentiment':    { title: '🌡️ 市场情绪',   api: '/api/sentiment' },
    'backtest':     { title: '⏱️ 回测系统',   api: '/api/backtest' },
};

let currentPage = 'scan-limit';
const _outputCache = {};  // 每个模块独立的输出缓存 { pageKey: htmlString }

// ═══════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
    // 自定义背景
    setupBackground();
    // 加载 Dashboard
    loadDashboard();

    // 导航点击 + hash 路由
    document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
            location.hash = el.dataset.page;
        });
    });

    // 监听 hash 变化
    function onHash() {
        const page = location.hash.slice(1) || 'scan-limit';
        if (PAGES[page]) switchPage(page);
    }
    window.addEventListener('hashchange', onHash);
    // 初始加载按 hash 定位
    const initPage = location.hash.slice(1) || 'scan-limit';
    if (PAGES[initPage]) {
        // 标记激活
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.page === initPage);
        });
        switchPage(initPage);
    }

    // Enter 键触发运行
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
            runCurrent();
        }
    });
});

// ═══════════════════════════════════════════
//  页面切换
// ═══════════════════════════════════════════

function switchPage(page) {
    const outputEl = document.getElementById('output');
    if (currentPage && outputEl) {
        _outputCache[currentPage] = outputEl.innerHTML;
    }

    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });

    const info = PAGES[page];
    document.getElementById('page-title').textContent = info.title;

    // 恢复缓存 + fade-in 动画
    const modulePage = document.querySelector('.module-page');
    modulePage.style.animation = 'none';
    void modulePage.offsetHeight;
    modulePage.style.animation = 'fadeInUp 0.3s ease both';

    if (_outputCache[page]) {
        outputEl.innerHTML = _outputCache[page];
    } else {
        outputEl.innerHTML = '<span class="loading">输出结果</span>';
    }
}

// ═══════════════════════════════════════════
//  运行扫描
// ═══════════════════════════════════════════

async function runCurrent() {
    const info = PAGES[currentPage];
    if (!info) return;
    delete _outputCache[currentPage];
    await callApi(info.api, currentPage);
}

async function callApi(apiUrl, pageKey) {
    const output = document.getElementById('output');
    output.innerHTML = '<span class="loading">⏳ 正在扫描...</span>';
    delete _outputCache[pageKey];

    const info = PAGES[pageKey] || PAGES['scan-limit'];

    if (info.textApi) {
        // 有卡片 API → 卡片视图
        await loadCardView(output, pageKey);
    } else {
        // 文本型页面
        await loadTextView(output, pageKey);
    }
    _outputCache[pageKey] = document.getElementById('output').innerHTML;
}

async function loadTextView(output, pageKey) {
    const info = PAGES[pageKey];
    try {
        const resp = await fetch(info.api);
        const data = await resp.json();
        if (data.ok === false) {
            output.innerHTML = `<span class="error-text">❌ 错误：</span>\n${escapeHtml(data.error || '未知错误')}\n\n${escapeHtml(data.output || '')}`;
        } else {
            const txt = data.output || '(空)';
            output.textContent = txt;
        }
    } catch (err) {
        output.innerHTML = `<span class="error-text">❌ 请求失败：</span> ${escapeHtml(err.message)}`;
    }
}

function analyzeStock(stk) {
    const tags = [];
    const notes = [];

    // 封板时间分析
    const st = parseInt(stk.seal_time);
    if (st <= 0930) tags.push({text:'开盘秒板', cls:'tag-green'});
    else if (st <= 1000) tags.push({text:'早盘板', cls:'tag-blue'});
    else if (st <= 1100) tags.push({text:'上午板', cls:'tag-blue'});
    else if (st <= 1400) tags.push({text:'午后板', cls:'tag-yellow'});
    else tags.push({text:'尾盘偷袭', cls:'tag-red'});

    // 资金分析
    if (stk.net_money > 1e8) {
        tags.push({text:'主力强', cls:'tag-green'});
    } else if (stk.net_money > 5e7) {
        tags.push({text:'资金正', cls:'tag-blue'});
    } else if (stk.net_money < 0) {
        tags.push({text:'资金流出', cls:'tag-red'});
        notes.push('⚠️ 主力净流出，注意次日抛压');
    }

    // 换手率分析
    const tr = parseFloat(stk.turnover);
    if (tr > 25) {
        tags.push({text:'爆量', cls:'tag-yellow'});
        notes.push('⚠️ 换手过高(>' + tr + '%)，次日接力难度大');
    } else if (tr > 15) {
        tags.push({text:'高换手', cls:'tag-yellow'});
    } else if (tr < 5) {
        tags.push({text:'缩量', cls:'tag-green'});
        notes.push('✅ 缩量涨停(' + tr + '%)，筹码锁定良好');
    }

    // 评分分析
    if (stk.sector_score >= 10) tags.push({text:'板块龙', cls:'tag-green'});
    if (stk.money_score >= 12) tags.push({text:'资金龙', cls:'tag-green'});
    if (stk.seal_score >= 22) tags.push({text:'封板强', cls:'tag-green'});

    // 综合评语
    if (stk.total_score >= 80) notes.push('🔥 综合评分优秀，多因子共振');
    else if (stk.total_score >= 70) notes.push('✅ 评分良好，关注次日竞价');
    else notes.push('📌 评分一般，需结合板块和资金面判断');

    return { tags, notes };
}

async function loadCardView(output, pageKey) {
    const info = PAGES[pageKey] || PAGES['scan-limit'];

    // 涨停扫描使用流式进度
    if (pageKey === 'scan-limit') {
        await loadCardViewStream(output, pageKey);
        return;
    }

    // 其他卡片页面
    try {
        const resp = await fetch(info.api);
        const data = await resp.json();

        const items = data.stocks || data.items || [];
        if (!data.ok || !items.length) {
            output.innerHTML = '<span class="loading">暂无数据</span>';
            return;
        }

        const s = data.sentiment || {};
        let html = '';
        if (s.level) {
            html += '<div class="sentiment-banner">';
            html += `📊 市场情绪: <strong>${s.level || '未知'}</strong>`;
            if (s.multiplier) html += ` ｜ 评分乘数 ×${s.multiplier}`;
            html += '</div>';
        }

        if (pageKey === 'scan-sector') {
            html += renderSectorCards(items);
        } else if (pageKey === 'scan-limit') {
            html += renderStockCards(items, data);
        } else {
            html += renderSimpleCards(items, pageKey);
        }
        output.innerHTML = html;
    } catch (err) {
        output.innerHTML = `<span class="error-text">❌ 请求失败：</span> ${escapeHtml(err.message)}`;
    }
    _outputCache[pageKey] = output.innerHTML;
}

async function loadCardViewStream(output, pageKey) {
    const bar = document.getElementById('progress-bar');
    const fill = document.getElementById('progress-fill');
    const txt = document.getElementById('progress-text');

    bar.style.display = 'block';
    fill.style.width = '3%';
    txt.textContent = '正在扫描...';
    output.innerHTML = '<span class="loading">⏳ 正在扫描...</span>';

    // 各步骤加权进度（资金流占最重）
    const STEP_PCT = { '第1步':5, '第2步':10, '第3步':40, '第4步':55, '第5步':65, '第6步':80, '第7步':90 };
    let currentPct = 3;

    // 短暂延迟让浏览器渲染进度条
    await new Promise(r => setTimeout(r, 80));

    try {
        const resp = await fetch('/api/scan/limit-up/stream');
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;

            buf += dec.decode(value, {stream: true});
            const parts = buf.split('\n\n');
            buf = parts.pop() || '';

            for (const part of parts) {
                for (const line of part.split('\n')) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const msg = JSON.parse(line.slice(6));

                        if (msg.type === 'progress') {
                            txt.textContent = msg.text;
                            // 按步骤加权估算进度
                            for (const [kw, pct] of Object.entries(STEP_PCT)) {
                                if (msg.text.includes(kw)) {
                                    currentPct = Math.max(currentPct, pct);
                                    break;
                                }
                            }
                            // 资金流子步骤修正
                            if (msg.text.includes('命中本地缓存')) currentPct = Math.max(currentPct, 48);
                            else if (msg.text.includes('同花顺资金流')) currentPct = Math.max(currentPct, 18);
                            fill.style.width = Math.min(95, currentPct) + '%';

                        } else if (msg.type === 'complete') {
                            bar.style.display = 'none';
                            const s = msg.sentiment || {};
                            let html = '';
                            if (s.level) {
                                html += '<div class="sentiment-banner">';
                                html += `📊 市场情绪: <strong>${escapeHtml(s.level)}</strong>`;
                                if (s.multiplier) html += ` ｜ 评分乘数 ×${s.multiplier}`;
                                html += '</div>';
                            }
                            html += renderStockCards(msg.stocks, msg);
                            output.innerHTML = html;
                            _outputCache[pageKey] = output.innerHTML;
                            return;

                        } else if (msg.type === 'error') {
                            bar.style.display = 'none';
                            output.innerHTML = `<span class="error-text">❌ ${escapeHtml(msg.text)}</span>`;
                            _outputCache[pageKey] = output.innerHTML;
                            return;
                        }
                    } catch (_) {}
                }
            }
        }
        bar.style.display = 'none';
        output.innerHTML = '<span class="loading">连接中断</span>';

    } catch (err) {
        bar.style.display = 'none';
        output.innerHTML = `<span class="error-text">❌ 请求失败：</span> ${escapeHtml(err.message)}`;
    }
}

// ═══════════════════════════════════════════
//  各页面卡片渲染
// ═══════════════════════════════════════════

function barColorClass(pct) {
    if (pct >= 70) return 'high';
    if (pct >= 40) return 'mid';
    return 'low';
}

function scoreRingColor(score) {
    if (score >= 80) return '#34d399';
    if (score >= 70) return '#fbbf24';
    if (score >= 55) return '#fb923c';
    return '#f87171';
}

function renderStockCards(stocks, data) {
    let html = '<div class="card-list">';
    stocks.forEach((stk, i) => {
        const analysis = analyzeStock(stk);
        const ringCol = scoreRingColor(stk.total_score);
        const ringPct = Math.min(100, Math.max(0, stk.total_score));
        const circ = 100; // circumference for r=15.9155 in a 36x36 viewBox
        const dash = (ringPct / 100) * circ;
        const moneySign = stk.net_money >= 0 ? '+' : '';
        const st = stk.seal_time || '0000';
        const stagger = Math.min(i + 1, 10);

        html += `<a href="${escapeHtml(stk.url)}" target="_blank" class="stock-card stagger-${stagger}">`;
        html += `<div class="card-header">`;
        html += `<span class="card-rank">#${stk.rank}</span>`;
        html += `<span class="card-name">${escapeHtml(stk.name)}</span>`;
        html += `<span class="card-code">${escapeHtml(stk.code)}</span>`;
        html += `<div class="score-ring-wrapper"><svg class="score-ring" viewBox="0 0 36 36">`;
        html += `<path class="score-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>`;
        html += `<path class="score-ring-fill" stroke="${ringCol}" stroke-dasharray="${dash} ${circ}" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>`;
        html += `<text class="score-ring-text" x="18" y="18">${stk.total_score}</text></svg></div>`;
        html += `</div>`;
        html += '<div class="card-body">';
        html += '<div class="card-bars">';
        const bars = [
            {label:'涨停强度', score:stk.seal_score, max:32},
            {label:'资金面', score:stk.money_score, max:20},
            {label:'板块热度', score:stk.sector_score, max:22},
            {label:'量价关系', score:stk.tech_score, max:10},
            {label:'历史股性', score:stk.history_score, max:5},
            {label:'舆情评分', score:stk.community_score, max:7},
        ];
        for (const b of bars) {
            const pct = Math.min(100, (b.score / b.max) * 100);
            const cls = barColorClass(pct);
            html += `<div class="bar-row"><span class="bar-label">${b.label}</span>`;
            html += `<div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>`;
            html += `<span class="bar-val">${b.score}</span></div>`;
        }
        html += '</div>';
        const netPct = stk.base_score > 0 ? ((stk.total_score - stk.base_score) / stk.base_score * 100).toFixed(1) : '0';
        html += '<div class="card-info">';
        html += `<div class="info-row"><span class="label">基础分</span><span class="value">${stk.base_score}</span></div>`;
        html += `<div class="info-row"><span class="label">情绪加成</span><span class="value">+${netPct}%</span></div>`;
        html += `<div class="info-row"><span class="label">净流入</span><span class="value ${stk.net_money >= 0 ? 'green' : 'red'}">${moneySign}${escapeHtml(stk.net_money_str)}</span></div>`;
        html += `<div class="info-row"><span class="label">换手率</span><span class="value">${escapeHtml(stk.turnover)}%</span></div>`;
        html += `<div class="info-row"><span class="label">封板时间</span><span class="value">${st.slice(0,2)}:${st.slice(2)}</span></div>`;
        html += '</div></div>';
        html += '<div class="card-analysis">';
        for (const tag of analysis.tags) {
            html += `<span class="tag ${tag.cls}">${escapeHtml(tag.text)}</span>`;
        }
        html += '</div>';
        if (analysis.notes.length) {
            html += '<div class="card-analysis" style="border-top:none;padding-top:0;margin-top:4px">';
            for (const note of analysis.notes) {
                html += `<span style="font-size:12px;color:var(--text-muted)">${escapeHtml(note)}</span>`;
            }
            html += '</div>';
        }
        html += '<div class="card-hint"><span>点击查看同花顺详情 →</span></div>';
        html += '</a>';
    });
    html += '</div>';
    return html;
}

function renderSectorCards(items) {
    let html = '<div class="card-list">';
    for (const item of items) {
        const effColor = item.efficiency >= 70 ? '#34d399' : item.efficiency >= 50 ? '#fbbf24' : '#f87171';
        html += `<div class="stock-card" style="cursor:default">`;
        html += `<div class="card-header">`;
        html += `<span class="card-rank">#${item.limit_count}只涨停</span>`;
        html += `<span class="card-name">${escapeHtml(item.name)}</span>`;
        html += `<span class="card-score" style="color:${effColor}">${item.score}</span>`;
        html += `</div>`;
        html += '<div class="card-body"><div class="card-bars">';
        const bars = [
            {label:'涨停数', score:item.limit_count, max:Math.max(1, item.limit_count*2)},
            {label:'炸板数', score:item.zhaban_count, max:Math.max(1, item.limit_count+item.zhaban_count)},
        ];
        for (const b of bars) {
            const pct = Math.min(100, (b.score / b.max) * 100);
            html += `<div class="bar-row"><span class="bar-label">${b.label}</span>`;
            html += `<div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;

        html += '</div>';
        html += '<div class="card-info">';
        html += `<div class="info-row"><span class="label">涨停</span><span class="value green">${item.limit_count}</span></div>`;
        html += `<div class="info-row"><span class="label">炸板</span><span class="value yellow">${item.zhaban_count}</span></div>`;
        html += `<div class="info-row"><span class="label">跌停</span><span class="value red">${item.dieting_count}</span></div>`;
        html += `<div class="info-row"><span class="label">封板率</span><span class="value" style="color:${effColor}">${item.efficiency}%</span></div>`;
        html += '</div></div>';
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function animateCount(el, target, duration) {
    const start = performance.now();
    function step(now) {
        const p = Math.min((now - start) / (duration || 800), 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

//  自定义背景

function setupBackground() {
    const saved = localStorage.getItem('customBg');
    if (saved) applyBg(saved);
}

function setBgPreset(gradient) {
    localStorage.setItem('customBg', gradient);
    applyBg(gradient);
}

function setBackground(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const dataUrl = e.target.result;
        localStorage.setItem('customBg', dataUrl);
        applyBg(dataUrl);
    };
    reader.readAsDataURL(file);
    input.value = '';
}

function clearBackground() {
    localStorage.removeItem('customBg');
    document.body.style.background = '';
    document.body.classList.remove('has-bg');
}

function applyBg(val) {
    if (val.startsWith('linear-gradient')) {
        document.body.style.background = val;
    } else {
        document.body.style.backgroundImage = `url(${val})`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
    }
    document.body.classList.add('has-bg');
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ═══════════════════════════════════════════
//  表格渲染：将 ASCII 表格转为 HTML 表格
// ═══════════════════════════════════════════

function renderTableOutput(txt) {
    // 检测是否是表格格式（含 │ 分隔符和 ── 边框）
    const lines = txt.split('\n').filter(l => l.trim());
    if (lines.length < 3) return null;
    if (!lines[0].includes('─')) return null;

    // 找表头行（含 │ 且不含连续 ─）
    let headerIdx = -1, dataStart = -1;
    for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (l.includes('│') && !l.includes('┼') && headerIdx === -1) {
            headerIdx = i;
        }
        if (l.includes('┼')) {
            dataStart = i + 1;
        }
    }
    if (headerIdx === -1 || dataStart === -1) return null;

    // 解析表头
    const headers = lines[headerIdx].split('│').map(h => h.trim()).filter(h => h);

    // 解析数据行
    const rows = [];
    for (let i = dataStart; i < lines.length; i++) {
        const l = lines[i];
        if (l.includes('─')) break;  // 到底部边框
        if (!l.includes('│')) continue;
        const cells = l.split('│').map(c => c.trim()).filter(c => c);
        if (cells.length === headers.length) {
            rows.push(cells);
        }
    }
    if (!rows.length) return null;

    // 判断哪些列是数值列（检查第一行数据，排除序号和股票代码）
    const numCols = new Set();
    const centerCols = new Set();
    if (rows.length > 0) {
        for (let i = 0; i < headers.length; i++) {
            const val = (rows[0][i] || '').trim();
            const h = headers[i].trim();
            // 序号列居中
            if (h === '#' || h === '序号') {
                centerCols.add(i);
                continue;
            }
            // 股票代码列居中
            if (h.includes('代码')) {
                centerCols.add(i);
                continue;
            }
            // 数值列右对齐（纯数字、百分比、带亿/万单位）
            if (/^[+-]?(0|[1-9]\d*)(\.\d+)?(%|亿|万)?$/.test(val) && val.length < 12) {
                numCols.add(i);
            }
        }
    }

    // 构建 HTML 表格
    let html = '<div class="table-wrap"><table class="data-table">';
    html += '<thead><tr>';
    for (let i = 0; i < headers.length; i++) {
        const h = headers[i];
        let cls = '';
        if (numCols.has(i)) cls = 'num';
        else if (centerCols.has(i)) cls = 'center';
        html += cls ? `<th class="${cls}">${escapeHtml(h)}</th>` : `<th>${escapeHtml(h)}</th>`;
    }
    html += '</tr></thead><tbody>';
    for (const row of rows) {
        html += '<tr>';
        for (let i = 0; i < row.length; i++) {
            const val = row[i];
            let cls = '';
            if (numCols.has(i)) cls = 'num';
            else if (centerCols.has(i)) cls = 'center';
            html += cls ? `<td class="${cls}">${escapeHtml(val)}</td>` : `<td>${escapeHtml(val)}</td>`;
        }
        html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
}

    });
